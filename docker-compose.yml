services:
  apex-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_live_engine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /app/data/ledger.db 'PRAGMA integrity_check;' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
